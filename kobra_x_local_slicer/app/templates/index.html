<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kobra X Local Slicer</title><link rel="stylesheet" href="./static/app.css"><script type="importmap">{"imports":{"three":"./static/vendor/three.module.js","three/addons/":"./static/vendor/"}}</script></head><body><header class="topbar"><div><strong>Kobra X Local Slicer</strong><small>local-only · ACE · PLA · 0.20 mm</small></div><span id="printerStatus" class="status neutral">verificando…</span></header><main><section id="configCard" class="card"><h2>Configuração</h2><div class="row"><label>IP da Kobra X<input id="printerHost" placeholder="192.168.1.50"></label><button id="discoverHa" class="secondary">Descobrir Home Assistant</button><button id="saveConfig">Salvar</button></div><p class="muted">Mapeie as entidades obrigatórias antes de salvar.</p><div id="haCandidates"></div><div id="haRoles" class="hidden"></div></section><section class="card"><h2>1. Enviar modelo</h2><label id="dropzone" class="dropzone">Arraste STL ou 3MF single-plate<input id="fileInput" type="file" accept=".stl,.3mf" hidden><span id="uploadMeta">máximo conforme configuração</span></label></section><section class="card"><div class="grid two"><div><h2>2. Preview e orientação</h2><div id="viewer" class="viewer"></div><p id="bbox" class="muted">—</p><div id="orientationButtons" class="orientation"><button class="secondary active" data-o="original">Original</button><button class="secondary" data-o="rotate_x_90">X 90°</button><button class="secondary" data-o="rotate_y_90">Y 90°</button><button class="secondary" data-o="rotate_z_90">Z 90°</button></div></div><div><h2>3. ACE</h2><div id="aceSlots" class="slots"></div><div class="actions"><button id="sliceBtn" disabled>Slice</button><span id="sliceState">aguardando modelo</span></div></div></div></section><section id="resultCard" class="card hidden"><h2>4. Resultado e confirmação</h2><div id="stats" class="stats"></div><div class="toolpath-wrap"><canvas id="toolpath" width="850" height="420"></canvas><label>Camada <input id="layerSlider" type="range"><span id="layerLabel">—</span></label></div><div class="confirm-box"><label><input id="tableClear" type="checkbox"> A mesa está livre e pronta</label><button id="printBtn" disabled>Confirmar e imprimir</button></div></section><section class="card"><h2>Log</h2><pre id="log"></pre></section></main><script type="module" src="./static/app.js"></script></body></html>
